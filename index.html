<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0B1426" />
  <title>Aether — Your Complete Financial Universe</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            navy: { 950: '#060b16', 900: '#0B1426', 800: '#111c33', 700: '#1a2744' },
            gold: { 400: '#E8C547', 500: '#D4AF37', 600: '#B8962E' },
            emerald: { 400: '#34D399', 500: '#10B981', 600: '#059669' }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Playfair Display', 'serif'],
          }
        }
      }
    }
  </script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    /* Aether Premium Theme */
    :root { --gold: #D4AF37; --navy: #0B1426; }
    html { scroll-behavior: smooth; }
    ::selection { background: rgba(212, 175, 55, 0.25); }
    
    .nav-btn { color: #64748b; }
    .nav-btn.active { color: #D4AF37; background: rgba(212, 175, 55, 0.1); }
    .dark .nav-btn { color: #94a3b8; }
    .dark .nav-btn.active { color: #E8C547; background: rgba(232, 197, 71, 0.12); }
    
    .aether-card {
      background: white; border-radius: 1.25rem;
      box-shadow: 0 4px 24px -4px rgba(11, 20, 38, 0.07), 0 2px 8px -2px rgba(11, 20, 38, 0.04);
      border: 1px solid rgba(226, 232, 240, 0.8); transition: all 0.25s ease;
    }
    .dark .aether-card {
      background: #111c33; border-color: rgba(26, 39, 68, 0.8);
      box-shadow: 0 4px 24px -4px rgba(0, 0, 0, 0.3);
    }
    .aether-card:hover { transform: translateY(-2px); box-shadow: 0 12px 40px -8px rgba(11, 20, 38, 0.12); }
    
    .gold-value {
      background: linear-gradient(135deg, #D4AF37 0%, #E8C547 50%, #B8962E 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    
    .pill {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.25rem 0.7rem; border-radius: 9999px;
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.02em;
    }
    
    .view-enter { animation: fadeSlideIn 0.35s ease forwards; }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
    .dark ::-webkit-scrollbar-thumb { background: #1a2744; }
    
    .chart-container { position: relative; width: 100%; max-height: 260px; }
    
    .icon-bg {
      width: 42px; height: 42px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    
    .rec-card { border-left: 3px solid #D4AF37; }
    
    @media (min-width: 768px) {
      .nav-btn { min-width: 90px; padding: 0.6rem 1.2rem; }
    }
  </style>
</head>
<body class="h-full bg-slate-50 dark:bg-navy-950 text-slate-900 dark:text-slate-100 font-sans antialiased transition-colors duration-300">
  
  <div id="app" class="h-full flex flex-col max-w-[1400px] mx-auto relative">
    
    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white/80 dark:bg-navy-900/80 backdrop-blur-xl border-b border-slate-200/60 dark:border-navy-700/60">
      <div class="px-5 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 flex items-center justify-center shadow-lg">
            <svg class="w-5 h-5 text-navy-900" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
          </div>
          <div>
            <h1 class="font-display text-xl font-bold tracking-tight text-navy-900 dark:text-white">Aether</h1>
            <p class="text-[10px] uppercase tracking-[0.18em] text-gold-600 dark:text-gold-400 font-medium -mt-0.5">Wealth Universe</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button id="themeToggle" class="p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-navy-800 transition-colors">
            <i data-lucide="moon" class="w-5 h-5 text-slate-600 dark:text-slate-300 hidden dark:block"></i>
            <i data-lucide="sun" class="w-5 h-5 text-slate-600 dark:text-slate-300 block dark:hidden"></i>
          </button>
          <button class="p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-navy-800 transition-colors relative">
            <i data-lucide="bell" class="w-5 h-5 text-slate-600 dark:text-slate-300"></i>
            <span class="absolute top-2 right-2 w-2 h-2 bg-rose-500 rounded-full"></span>
          </button>
        </div>
      </div>
    </header>

    <main id="mainContent" class="flex-1 overflow-y-auto pb-28 px-4 sm:px-6 pt-5"></main>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-white/90 dark:bg-navy-900/90 backdrop-blur-xl border-t border-slate-200/70 dark:border-navy-700/70">
      <div class="max-w-[1400px] mx-auto px-2">
        <div class="flex items-center justify-around py-2">
          <button data-view="dashboard" class="nav-btn active flex flex-col items-center gap-1 px-4 py-2 rounded-2xl transition-all min-w-[72px]">
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
            <span class="text-[11px] font-medium">Dashboard</span>
          </button>
          <button data-view="wealth" class="nav-btn flex flex-col items-center gap-1 px-4 py-2 rounded-2xl transition-all min-w-[72px]">
            <i data-lucide="wallet" class="w-5 h-5"></i>
            <span class="text-[11px] font-medium">Wealth</span>
          </button>
          <button data-view="cashflow" class="nav-btn flex flex-col items-center gap-1 px-4 py-2 rounded-2xl transition-all min-w-[72px]">
            <i data-lucide="arrow-left-right" class="w-5 h-5"></i>
            <span class="text-[11px] font-medium">Cashflow</span>
          </button>
          <button data-view="cards" class="nav-btn flex flex-col items-center gap-1 px-4 py-2 rounded-2xl transition-all min-w-[72px]">
            <i data-lucide="credit-card" class="w-5 h-5"></i>
            <span class="text-[11px] font-medium">Cards</span>
          </button>
          <button data-view="insights" class="nav-btn flex flex-col items-center gap-1 px-4 py-2 rounded-2xl transition-all min-w-[72px]">
            <i data-lucide="sparkles" class="w-5 h-5"></i>
            <span class="text-[11px] font-medium">Insights</span>
          </button>
        </div>
      </div>
    </nav>
  </div>

  <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-[100] hidden">
    <div class="bg-navy-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-sm font-medium">
      <i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>
      <span id="toastMsg">Saved successfully</span>
    </div>
  </div>

  <script>

        { id: 'gold2', type: 'gold', name: 'Sovereign Gold Bonds + Coins', category: 'Gold', value: 1300000, weight: '142 grams equiv.', notes: 'SGB 2023 series + physical coins', icon: 'coins', color: 'bg-amber-500/10 text-amber-600' },
        { id: 'fd1', type: 'fd', name: 'HDFC Bank FD', category: 'Fixed Deposit', value: 3500000, rate: 7.25, startDate: '2024-11-05', maturityDate: '2026-11-05', bank: 'HDFC Bank', currency: 'INR', autoRenew: true, icon: 'landmark', color: 'bg-emerald-500/10 text-emerald-600' },
        { id: 'fd2', type: 'fd', name: 'SBI Tax Saver FD', category: 'Fixed Deposit', value: 2700000, rate: 6.90, startDate: '2025-01-15', maturityDate: '2030-01-15', bank: 'State Bank of India', currency: 'INR', icon: 'landmark', color: 'bg-emerald-500/10 text-emerald-600' },
        { id: 'stock1', type: 'stocks', name: 'Equity Portfolio (Zerodha)', category: 'Stocks', value: 9840000, invested: 7120000, notes: 'Diversified across IT, Banking, Pharma & Index funds', icon: 'trending-up', color: 'bg-violet-500/10 text-violet-600' },
        { id: 'car1', type: 'vehicle', name: 'Mercedes-Benz GLC 300', category: 'Vehicles', value: 6200000, purchaseValue: 7850000, purchaseDate: '2023-08-10', notes: 'Depreciating asset. Full service history maintained.', documents: [{ name: 'RC Book', type: 'pdf' }, { name: 'Insurance', type: 'link' }], icon: 'car', color: 'bg-orange-500/10 text-orange-600' },
        { id: 'bike1', type: 'vehicle', name: 'Royal Enfield Interceptor 650', category: 'Vehicles', value: 285000, purchaseValue: 340000, purchaseDate: '2022-12-01', icon: 'bike', color: 'bg-orange-500/10 text-orange-600' },
        { id: 'cash1', type: 'cash', name: 'Savings + Liquid Funds', category: 'Cash & Others', value: 2700000, notes: 'Emergency fund + short-term liquid funds', icon: 'piggy-bank', color: 'bg-slate-500/10 text-slate-600' }
      ],
      liabilities: [
        { id: 'loan1', name: 'Home Loan — HDFC', outstanding: 4850000, emi: 42500, dueDate: 5, icon: 'home' },
        { id: 'loan2', name: 'Car Loan — residual', outstanding: 680000, emi: 18500, dueDate: 12, icon: 'car' }
      ],
      cards: [
        { id: 'card1', name: 'HDFC Regalia Gold', outstanding: 87420, statementDate: 18, dueDate: 5, limit: 500000, status: 'due-soon', lastPaid: '2026-07-04' },
        { id: 'card2', name: 'Amex Platinum Travel', outstanding: 31250, statementDate: 22, dueDate: 10, limit: 400000, status: 'ok', lastPaid: '2026-07-09' },
        { id: 'card3', name: 'SBI SimplyCLICK', outstanding: 0, statementDate: 5, dueDate: 25, limit: 150000, status: 'clear', lastPaid: '2026-07-20' }
      ],
      cashflow: {
        month: 'August 2026',
        income: [
          { id: 'inc1', name: 'Salary — Tech Corp', amount: 285000, category: 'Salary', date: '2026-08-01', recurring: true },
          { id: 'inc2', name: 'Rental Income — Koregaon', amount: 42000, category: 'Rental', date: '2026-08-05', recurring: true },
          { id: 'inc3', name: 'Dividends & Interest', amount: 18750, category: 'Investments', date: '2026-08-10', recurring: false }
        ],
        expenses: [
          { id: 'exp1', name: 'Home Loan EMI', amount: 42500, category: 'Housing', date: '2026-08-05', recurring: true },
          { id: 'exp2', name: 'Car Loan EMI', amount: 18500, category: 'Transport', date: '2026-08-12', recurring: true },
          { id: 'exp3', name: 'School Fees — Q2', amount: 65000, category: 'Education', date: '2026-08-03', recurring: false },
          { id: 'exp4', name: 'Electricity + Water + Gas', amount: 8420, category: 'Utilities', date: '2026-08-08', recurring: true },
          { id: 'exp5', name: 'Internet + Mobile', amount: 2999, category: 'Utilities', date: '2026-08-07', recurring: true },
          { id: 'exp6', name: 'Grocery & Household', amount: 28450, category: 'Grocery', date: '2026-08-14', recurring: false },
          { id: 'exp7', name: 'Dining Out & Cafes', amount: 14800, category: 'Dining', date: '2026-08-12', recurring: false },
          { id: 'exp8', name: 'Fuel & Transport', amount: 9200, category: 'Transport', date: '2026-08-11', recurring: false },
          { id: 'exp9', name: 'Shopping — Family', amount: 22600, category: 'Shopping', date: '2026-08-09', recurring: false },
          { id: 'exp10', name: 'Healthcare & Medicines', amount: 4850, category: 'Healthcare', date: '2026-08-06', recurring: false },
          { id: 'exp11', name: 'Subscriptions (Netflix, etc)', amount: 2499, category: 'Subscriptions', date: '2026-08-01', recurring: true }
        ]
      },
      recommendations: [
        { id: 'rec1', type: 'invest', title: 'Deploy Surplus Intelligently', text: 'You have ~₹1.18L surplus this month after expenses. Consider increasing your equity SIP by ₹40–50k or parking in a liquid fund until market levels improve.', impact: 'High', icon: 'trending-up' },
        { id: 'rec2', type: 'reduce', title: 'Dining & Shopping Alert', text: 'Dining out + Shopping together are 18% of this month’s expenses. A 25% reduction frees ~₹9,300/month — enough for an extra SIP installment.', impact: 'Medium', icon: 'scissors' },
        { id: 'rec3', type: 'action', title: 'HDFC Regalia — Payment Due', text: 'Outstanding ₹87,420. Statement generated. Due date is 5th. Pay before due date to avoid interest and protect credit score.', impact: 'Urgent', icon: 'credit-card' },
        { id: 'rec4', type: 'optimize', title: 'FD Maturity Window', text: 'HDFC FD of ₹35L matures in Nov 2026. Current rate 7.25%. Explore laddering or shifting part into higher-yield instruments if rates stay elevated.', impact: 'Medium', icon: 'calendar' }
      ]
    };

    function formatINR(num) {
      if (num >= 10000000) return '₹' + (num / 10000000).toFixed(2) + ' Cr';
      if (num >= 100000) return '₹' + (num / 100000).toFixed(2) + ' L';
      return '₹' + num.toLocaleString('en-IN');
    }
    function formatFullINR(num) {
      return '₹' + Math.round(num).toLocaleString('en-IN');
    }

    // ========== APP LOGIC ==========
    let currentView = 'dashboard';
    let charts = {};

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      bindNavigation();
      renderView('dashboard');
      setTimeout(() => lucide.createIcons(), 100);
    });

    function initTheme() {
      const saved = localStorage.getItem('aether-theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
      document.getElementById('themeToggle').addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('aether-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        if (currentView === 'dashboard') renderDashboard();
        if (currentView === 'cashflow') renderCashflow();
      });
    }

    function bindNavigation() {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const view = btn.dataset.view;
          document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderView(view);
        });
      });
    }

    function renderView(view) {
      currentView = view;
      Object.values(charts).forEach(c => c.destroy());
      charts = {};
      const main = document.getElementById('mainContent');
      main.innerHTML = '';
      main.classList.add('view-enter');
      switch (view) {
        case 'dashboard': renderDashboard(); break;
        case 'wealth': renderWealth(); break;
        case 'cashflow': renderCashflow(); break;
        case 'cards': renderCards(); break;
        case 'insights': renderInsights(); break;
      }
      setTimeout(() => lucide.createIcons(), 50);
    }

    function renderDashboard() {
      const d = AETHER_DATA;
      const incomeTotal = d.cashflow.income.reduce((s, i) => s + i.amount, 0);
      const expenseTotal = d.cashflow.expenses.reduce((s, e) => s + e.amount, 0);
      const surplus = incomeTotal - expenseTotal;

      document.getElementById('mainContent').innerHTML = `
        <section class="mb-6">
          <div class="aether-card p-6 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-64 h-64 bg-gradient-to-bl from-gold-500/10 to-transparent rounded-full -translate-y-1/2 translate-x-1/3"></div>
            <p class="text-sm font-medium text-slate-500 dark:text-slate-400 mb-1">Total Net Worth</p>
            <h2 class="text-3xl sm:text-4xl font-bold tracking-tight gold-value">${formatINR(d.netWorth.total)}</h2>
            <div class="flex items-center gap-3 mt-3">
              <span class="inline-flex items-center gap-1 text-sm font-semibold text-emerald-600 dark:text-emerald-400">
                <i data-lucide="trending-up" class="w-4 h-4"></i> +${d.netWorth.change30d}% this month
              </span>
              <span class="text-xs text-slate-400">Updated ${d.user.lastUpdated}</span>
            </div>
            <div class="grid grid-cols-2 gap-4 mt-6 pt-5 border-t border-slate-100 dark:border-navy-700">
              <div>
                <p class="text-xs text-slate-500 mb-0.5">Total Assets</p>
                <p class="text-lg font-semibold text-slate-800 dark:text-slate-100">${formatINR(d.netWorth.assets)}</p>
              </div>
              <div>
                <p class="text-xs text-slate-500 mb-0.5">Liabilities</p>
                <p class="text-lg font-semibold text-rose-600 dark:text-rose-400">${formatINR(d.netWorth.liabilities)}</p>
              </div>
            </div>
          </div>
        </section>

        <section class="mb-6">
          <h3 class="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-3">This Month — ${d.cashflow.month}</h3>
          <div class="grid grid-cols-3 gap-3">
            <div class="aether-card p-4 text-center">
              <p class="text-xs text-slate-500 mb-1">Income</p>
              <p class="text-lg font-bold text-emerald-600 dark:text-emerald-400">${formatINR(incomeTotal)}</p>
            </div>
            <div class="aether-card p-4 text-center">
              <p class="text-xs text-slate-500 mb-1">Expenses</p>
              <p class="text-lg font-bold text-rose-600 dark:text-rose-400">${formatINR(expenseTotal)}</p>
            </div>
            <div class="aether-card p-4 text-center">
              <p class="text-xs text-slate-500 mb-1">Surplus</p>
              <p class="text-lg font-bold ${surplus >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600'}">${formatINR(surplus)}</p>
            </div>
          </div>
        </section>

        <section class="mb-6">
          <div class="aether-card p-5">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-semibold text-slate-800 dark:text-slate-100">Asset Allocation</h3>
              <span class="text-xs text-slate-400">by value</span>
            </div>
            <div class="chart-container"><canvas id="allocationChart" height="220"></canvas></div>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-4">
              ${d.allocation.map(a => `
                <div class="flex items-center gap-2 text-xs">
                  <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:${a.color}"></span>
                  <span class="text-slate-600 dark:text-slate-300 truncate">${a.name}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </section>

        <section class="mb-6">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Smart Recommendations</h3>
            <button onclick="renderView('insights')" class="text-xs font-medium text-gold-600 dark:text-gold-400">View all →</button>
          </div>
          <div class="space-y-3">
            ${d.recommendations.slice(0, 2).map(r => `
              <div class="aether-card p-4 rec-card">
                <div class="flex gap-3">
                  <div class="icon-bg bg-gold-500/10 text-gold-600 dark:text-gold-400">
                    <i data-lucide="${r.icon}" class="w-5 h-5"></i>
                  </div>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-0.5">
                      <h4 class="font-semibold text-sm text-slate-800 dark:text-slate-100">${r.title}</h4>
                      <span class="pill ${r.impact === 'Urgent' ? 'bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300' : r.impact === 'High' ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300' : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300'}">${r.impact}</span>
                    </div>
                    <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">${r.text}</p>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </section>

        <section class="mb-4">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Key Assets</h3>
            <button onclick="document.querySelector('[data-view=wealth]').click()" class="text-xs font-medium text-gold-600 dark:text-gold-400">See all →</button>
          </div>
          <div class="space-y-2.5">
            ${d.assets.slice(0, 4).map(a => `
              <div class="aether-card p-3.5 flex items-center gap-3">
                <div class="icon-bg ${a.color}"><i data-lucide="${a.icon}" class="w-5 h-5"></i></div>
                <div class="flex-1 min-w-0">
                  <p class="font-medium text-sm text-slate-800 dark:text-slate-100 truncate">${a.name}</p>
                  <p class="text-xs text-slate-500">${a.category}</p>
                </div>
                <p class="font-semibold text-sm text-slate-800 dark:text-slate-100">${formatINR(a.value)}</p>
              </div>
            `).join('')}
          </div>
        </section>
      `;
      setTimeout(() => { createAllocationChart(); lucide.createIcons(); }, 30);
    }

    function createAllocationChart() {
      const ctx = document.getElementById('allocationChart');
      if (!ctx) return;
      charts.allocation = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: AETHER_DATA.allocation.map(a => a.name),
          datasets: [{ data: AETHER_DATA.allocation.map(a => a.value), backgroundColor: AETHER_DATA.allocation.map(a => a.color), borderWidth: 0, hoverOffset: 8 }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '68%',
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => { const total = ctx.dataset.data.reduce((a, b) => a + b, 0); const pct = ((ctx.raw / total) * 100).toFixed(1); return ` ${formatINR(ctx.raw)} (${pct}%)`; } } } }
        }
      });
    }

    function renderWealth() {
      const d = AETHER_DATA;
      const totalAssets = d.assets.reduce((s, a) => s + a.value, 0);
      document.getElementById('mainContent').innerHTML = `
        <div class="flex items-center justify-between mb-5">
          <div>
            <h2 class="text-xl font-bold text-slate-900 dark:text-white">Wealth</h2>
            <p class="text-sm text-slate-500">${d.assets.length} assets • ${formatINR(totalAssets)}</p>
          </div>
          <button onclick="showToast('Add Asset form coming in next iteration')" class="flex items-center gap-2 bg-gradient-to-r from-gold-500 to-gold-600 text-navy-900 font-semibold text-sm px-4 py-2.5 rounded-xl">
            <i data-lucide="plus" class="w-4 h-4"></i> Add Asset
          </button>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-6">
          <div class="aether-card p-4">
            <p class="text-xs text-slate-500 mb-1">Total Assets</p>
            <p class="text-xl font-bold text-slate-900 dark:text-white">${formatINR(d.netWorth.assets)}</p>
          </div>
          <div class="aether-card p-4">
            <p class="text-xs text-slate-500 mb-1">Net Worth</p>
            <p class="text-xl font-bold gold-value">${formatINR(d.netWorth.total)}</p>
          </div>
        </div>
        <div class="space-y-3">
          ${d.assets.map(a => `
            <div class="aether-card p-4" onclick="showToast('${a.name} — detailed view coming soon')">
              <div class="flex items-start gap-3">
                <div class="icon-bg ${a.color} mt-0.5"><i data-lucide="${a.icon}" class="w-5 h-5"></i></div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-start justify-between gap-2">
                    <div>
                      <h4 class="font-semibold text-slate-900 dark:text-white text-[15px]">${a.name}</h4>
                      <p class="text-xs text-slate-500 mt-0.5">${a.category}${a.location ? ' • ' + a.location : ''}</p>
                    </div>
                    <p class="font-bold text-slate-900 dark:text-white whitespace-nowrap">${formatINR(a.value)}</p>
                  </div>
                  ${a.purchaseValue ? `<div class="mt-2 flex items-center gap-3 text-xs"><span class="text-slate-500">Bought: ${formatINR(a.purchaseValue)}</span><span class="font-medium ${a.value >= a.purchaseValue ? 'text-emerald-600' : 'text-rose-500'}">${a.value >= a.purchaseValue ? '+' : ''}${(((a.value - a.purchaseValue) / a.purchaseValue) * 100).toFixed(1)}%</span></div>` : ''}
                  ${a.documents && a.documents.length ? `<div class="mt-2.5 flex items-center gap-1.5"><i data-lucide="paperclip" class="w-3.5 h-3.5 text-slate-400"></i><span class="text-xs text-slate-500">${a.documents.length} document${a.documents.length > 1 ? 's' : ''}</span></div>` : ''}
                </div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="mt-8">
          <h3 class="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-3">Liabilities</h3>
          <div class="space-y-2.5">
            ${d.liabilities.map(l => `
              <div class="aether-card p-4 flex items-center gap-3">
                <div class="icon-bg bg-rose-500/10 text-rose-600"><i data-lucide="${l.icon}" class="w-5 h-5"></i></div>
                <div class="flex-1">
                  <p class="font-medium text-sm text-slate-800 dark:text-slate-100">${l.name}</p>
                  <p class="text-xs text-slate-500">EMI ${formatFullINR(l.emi)} • Due on ${l.dueDate}th</p>
                </div>
                <p class="font-semibold text-rose-600 dark:text-rose-400">${formatINR(l.outstanding)}</p>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function renderCashflow() {
      const d = AETHER_DATA.cashflow;
      const incomeTotal = d.income.reduce((s, i) => s + i.amount, 0);
      const expenseTotal = d.expenses.reduce((s, e) => s + e.amount, 0);
      const surplus = incomeTotal - expenseTotal;
      const expByCat = {};
      d.expenses.forEach(e => { expByCat[e.category] = (expByCat[e.category] || 0) + e.amount; });
      const catLabels = Object.keys(expByCat);
      const catValues = Object.values(expByCat);
      const catColors = ['#F43F5E', '#F59E0B', '#3B82F6', '#8B5CF6', '#10B981', '#EC4899', '#64748B', '#14B8A6'];

      document.getElementById('mainContent').innerHTML = `
        <div class="flex items-center justify-between mb-5">
          <div>
            <h2 class="text-xl font-bold text-slate-900 dark:text-white">Cashflow</h2>
            <p class="text-sm text-slate-500">${d.month}</p>
          </div>
          <button onclick="showToast('Add transaction form coming next')" class="flex items-center gap-2 bg-gradient-to-r from-gold-500 to-gold-600 text-navy-900 font-semibold text-sm px-4 py-2.5 rounded-xl">
            <i data-lucide="plus" class="w-4 h-4"></i> Add
          </button>
        </div>
        <div class="grid grid-cols-3 gap-3 mb-6">
          <div class="aether-card p-4 text-center"><p class="text-xs text-slate-500 mb-1">Income</p><p class="text-lg font-bold text-emerald-600">${formatINR(incomeTotal)}</p></div>
          <div class="aether-card p-4 text-center"><p class="text-xs text-slate-500 mb-1">Expenses</p><p class="text-lg font-bold text-rose-600">${formatINR(expenseTotal)}</p></div>
          <div class="aether-card p-4 text-center"><p class="text-xs text-slate-500 mb-1">Net</p><p class="text-lg font-bold ${surplus >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${formatINR(surplus)}</p></div>
        </div>
        <div class="aether-card p-5 mb-6">
          <h3 class="font-semibold text-slate-800 dark:text-slate-100 mb-4">Expense Breakdown</h3>
          <div class="chart-container" style="max-height:200px"><canvas id="expenseChart" height="180"></canvas></div>
        </div>
        <div class="mb-6">
          <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Income</h3>
          <div class="space-y-2">
            ${d.income.map(i => `
              <div class="aether-card p-3.5 flex items-center justify-between">
                <div><p class="font-medium text-sm text-slate-800 dark:text-slate-100">${i.name}</p><p class="text-xs text-slate-500">${i.category} • ${i.date}${i.recurring ? ' • Recurring' : ''}</p></div>
                <p class="font-semibold text-emerald-600">+${formatFullINR(i.amount)}</p>
              </div>
            `).join('')}
          </div>
        </div>
        <div>
          <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-rose-500"></span> Expenses</h3>
          <div class="space-y-2">
            ${d.expenses.map(e => `
              <div class="aether-card p-3.5 flex items-center justify-between">
                <div><p class="font-medium text-sm text-slate-800 dark:text-slate-100">${e.name}</p><p class="text-xs text-slate-500">${e.category} • ${e.date}${e.recurring ? ' • Recurring' : ''}</p></div>
                <p class="font-semibold text-rose-600">-${formatFullINR(e.amount)}</p>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      setTimeout(() => {
        const ctx = document.getElementById('expenseChart');
        if (ctx) {
          charts.expense = new Chart(ctx, {
            type: 'bar',
            data: { labels: catLabels, datasets: [{ data: catValues, backgroundColor: catColors.slice(0, catLabels.length), borderRadius: 6, borderSkipped: false }] },
            options: {
              responsive: true, maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { display: false }, ticks: { font: { size: 10 } } },
                y: { grid: { color: document.documentElement.classList.contains('dark') ? '#1a2744' : '#f1f5f9' }, ticks: { callback: v => (v/1000) + 'k' } }
              }
            }
          });
        }
        lucide.createIcons();
      }, 30);
    }

    function renderCards() {
      const cards = AETHER_DATA.cards;
      document.getElementById('mainContent').innerHTML = `
        <div class="flex items-center justify-between mb-5">
          <div>
            <h2 class="text-xl font-bold text-slate-900 dark:text-white">Cards & Reminders</h2>
            <p class="text-sm text-slate-500">Privacy-safe • No full numbers stored</p>
          </div>
          <button onclick="showToast('Add card form coming soon')" class="flex items-center gap-2 bg-gradient-to-r from-gold-500 to-gold-600 text-navy-900 font-semibold text-sm px-4 py-2.5 rounded-xl">
            <i data-lucide="plus" class="w-4 h-4"></i> Add Card
          </button>
        </div>
        <div class="space-y-4">
          ${cards.map(c => {
            const statusColor = c.status === 'due-soon' ? 'bg-amber-500' : c.status === 'clear' ? 'bg-emerald-500' : 'bg-slate-400';
            const statusText = c.status === 'due-soon' ? 'Due Soon' : c.status === 'clear' ? 'Cleared' : 'Active';
            return `
              <div class="aether-card p-5 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-bl from-gold-500/5 to-transparent rounded-full"></div>
                <div class="flex items-start justify-between mb-4">
                  <div>
                    <h3 class="font-semibold text-lg text-slate-900 dark:text-white">${c.name}</h3>
                    <p class="text-xs text-slate-500 mt-0.5">Statement: ${c.statementDate}th • Due: ${c.dueDate}th</p>
                  </div>
                  <span class="pill ${c.status === 'due-soon' ? 'bg-amber-100 text-amber-800 dark:bg-amber-900/50 dark:text-amber-300' : c.status === 'clear' ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-300' : 'bg-slate-100 text-slate-600'}">
                    <span class="w-1.5 h-1.5 rounded-full ${statusColor}"></span> ${statusText}
                  </span>
                </div>
                <div class="grid grid-cols-2 gap-4">
                  <div><p class="text-xs text-slate-500">Outstanding</p><p class="text-xl font-bold ${c.outstanding > 0 ? 'text-rose-600' : 'text-emerald-600'}">${formatFullINR(c.outstanding)}</p></div>
                  <div><p class="text-xs text-slate-500">Limit</p><p class="text-lg font-semibold text-slate-700 dark:text-slate-200">${formatINR(c.limit)}</p></div>
                </div>
                ${c.outstanding > 0 ? `<div class="mt-4 pt-3 border-t border-slate-100 dark:border-navy-700 flex items-center justify-between"><p class="text-xs text-slate-500">Last paid: ${c.lastPaid}</p><button onclick="showToast('Reminder set for ${c.name}')" class="text-xs font-semibold text-gold-600 dark:text-gold-400 flex items-center gap-1"><i data-lucide="bell" class="w-3.5 h-3.5"></i> Set Reminder</button></div>` : ''}
              </div>
            `;
          }).join('')}
        </div>
        <div class="mt-8 aether-card p-5 bg-gradient-to-br from-navy-900 to-navy-800 text-white">
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-xl bg-gold-500/20 flex items-center justify-center flex-shrink-0"><i data-lucide="shield-check" class="w-5 h-5 text-gold-400"></i></div>
            <div>
              <h4 class="font-semibold mb-1">Privacy First</h4>
              <p class="text-sm text-slate-300 leading-relaxed">We only store card name, statement date, due date and outstanding amount. Never full card number, CVV or expiry.</p>
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function renderInsights() {
      const d = AETHER_DATA;
      const incomeTotal = d.cashflow.income.reduce((s, i) => s + i.amount, 0);
      const expenseTotal = d.cashflow.expenses.reduce((s, e) => s + e.amount, 0);
      const surplus = incomeTotal - expenseTotal;
      const savingsRate = ((surplus / incomeTotal) * 100).toFixed(1);

      document.getElementById('mainContent').innerHTML = `
        <div class="mb-6">
          <h2 class="text-xl font-bold text-slate-900 dark:text-white">Insights & Recommendations</h2>
          <p class="text-sm text-slate-500">AI-powered guidance for your wealth</p>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-6">
          <div class="aether-card p-4"><p class="text-xs text-slate-500 mb-1">Savings Rate</p><p class="text-2xl font-bold text-emerald-600">${savingsRate}%</p><p class="text-xs text-slate-400 mt-1">of monthly income</p></div>
          <div class="aether-card p-4"><p class="text-xs text-slate-500 mb-1">Monthly Surplus</p><p class="text-2xl font-bold gold-value">${formatINR(surplus)}</p><p class="text-xs text-slate-400 mt-1">available to invest</p></div>
        </div>
        <div class="space-y-3 mb-8">
          ${d.recommendations.map(r => `
            <div class="aether-card p-5 rec-card">
              <div class="flex gap-3">
                <div class="icon-bg bg-gold-500/10 text-gold-600 dark:text-gold-400 flex-shrink-0"><i data-lucide="${r.icon}" class="w-5 h-5"></i></div>
                <div>
                  <div class="flex items-center gap-2 mb-1">
                    <h4 class="font-semibold text-slate-900 dark:text-white">${r.title}</h4>
                    <span class="pill ${r.impact === 'Urgent' ? 'bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300' : r.impact === 'High' ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300' : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300'}">${r.impact}</span>
                  </div>
                  <p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed">${r.text}</p>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="aether-card p-5 border border-dashed border-gold-500/40">
          <h4 class="font-semibold text-slate-900 dark:text-white mb-2 flex items-center gap-2"><i data-lucide="sparkles" class="w-4 h-4 text-gold-500"></i> Coming in full version</h4>
          <ul class="text-sm text-slate-600 dark:text-slate-300 space-y-1.5">
            <li>• Voice commands to add transactions & update values</li>
            <li>• SMS / WhatsApp auto-import (with your permission)</li>
            <li>• Document OCR extraction from bills & statements</li>
            <li>• Goal-based investment recommendations</li>
            <li>• Multi-currency live rates & family sharing</li>
          </ul>
        </div>
      `;
      lucide.createIcons();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2800);
    }
  </script>
</body>
</html>
